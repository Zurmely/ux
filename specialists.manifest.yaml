# UX multi-agent team — specialist registry
# Used during first-time setup to enable/disable specialists (Chief is always on).

version: 1
orchestrator:
  id: chief-ux-designer
  name: Chief UX Designer
  description: >-
    Orchestrates the UX team, briefs specialists, reconciles outputs, and
    produces the final design deliverable and handoff.
  always_enabled: true
  skill_path: chief-ux-designer/SKILL.md

onboarding:
  skill_path: onboarding/SKILL.md
  selection_prompt: >-
    Choose which specialist agents to create for this workspace. The Chief UX
    Designer is always available. Disabled specialists are not invoked until
    you enable them and re-run setup.

specialists:
  - id: ux-writer
    name: UX Writer
    description: >-
      Content strategy, voice and tone, UI copy, error messages, onboarding
      text, and documentation that supports the product experience.
    suggested: true
    default_enabled: true
    skill_path: specialists/ux-writer/SKILL.md
    sub_skills:
      - specialists/ux-writer/skills/voice-and-tone/SKILL.md
      - specialists/ux-writer/skills/ui-copy/SKILL.md
      - specialists/ux-writer/skills/content-strategy/SKILL.md

  - id: motion-designer
    name: Motion Designer
    description: >-
      Motion principles, transitions, loading and feedback animation, and
      specs engineers and UI can implement (including Figma motion context).
    suggested: true
    default_enabled: true
    skill_path: specialists/motion-designer/SKILL.md
    sub_skills:
      - specialists/motion-designer/skills/motion-spec/SKILL.md
      - specialists/motion-designer/skills/micro-interactions/SKILL.md

  - id: illustrator
    name: Illustrator
    description: >-
      Custom illustration, iconography direction, empty states, marketing
      spots, and visual narrative aligned to brand.
    suggested: true
    default_enabled: true
    skill_path: specialists/illustrator/SKILL.md
    sub_skills:
      - specialists/illustrator/skills/iconography/SKILL.md
      - specialists/illustrator/skills/spot-illustration/SKILL.md

  - id: ui-designer
    name: UI Designer
    description: >-
      Visual UI, layout, components, interaction patterns, prototypes, and
      design-system alignment (tokens, components, documentation).
    suggested: true
    default_enabled: true
    skill_path: specialists/ui-designer/SKILL.md
    sub_skills:
      - specialists/ui-designer/skills/interaction-design/SKILL.md
      - specialists/ui-designer/skills/prototyping/SKILL.md
      - specialists/ui-designer/skills/design-systems/SKILL.md
      - specialists/ui-designer/skills/visual-ui/SKILL.md

  - id: ux-researcher
    name: UX Researcher
    description: >-
      Research planning, interviews, usability tests, synthesis, personas,
      journey maps, and evidence for design decisions (docs in Google Drive).
    suggested: true
    default_enabled: true
    skill_path: specialists/ux-researcher/SKILL.md
    sub_skills:
      - specialists/ux-researcher/skills/research-plan/SKILL.md
      - specialists/ux-researcher/skills/synthesis/SKILL.md
      - specialists/ux-researcher/skills/usability-testing/SKILL.md

  - id: accessibility-specialist
    name: Accessibility Specialist
    description: >-
      WCAG-oriented audits, inclusive patterns, remediation specs, and
      acceptance criteria so shipped UI meets accessibility goals.
    suggested: true
    default_enabled: true
    skill_path: specialists/accessibility-specialist/SKILL.md
    sub_skills:
      - specialists/accessibility-specialist/skills/audit/SKILL.md
      - specialists/accessibility-specialist/skills/inclusive-patterns/SKILL.md

# After selection, persist enabled ids (example — adapt to your agent host):
# .ux-team/enabled-specialists.json → { "enabled": ["ux-writer", "ui-designer", ...] }
